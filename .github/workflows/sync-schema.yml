# Pulls the contract files erupt generates (mvn -pl erupt-test -Pnode-schema test) and opens a PR when they
# changed. Needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
name: sync-schema

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "erupts/erupt branch or tag to read schema/ from"
        default: "master"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref || 'master' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download schema
        run: |
          # the ref goes into a URL and a branch name: accept plain branch / tag names only
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "illegal ref: $REF"; exit 1; }
          mkdir -p "$RUNNER_TEMP/schema"
          for f in erupt-annotations.schema.json erupt-node-defaults.json; do
            curl -fsSL "https://raw.githubusercontent.com/erupts/erupt/$REF/schema/$f" -o "$RUNNER_TEMP/schema/$f"
          done
      - name: Regenerate
        working-directory: python
        run: |
          python tools/gen_types.py "$RUNNER_TEMP/schema"
          PYTHONPATH=src python -m unittest discover -s tests
      - name: Open a pull request
        run: |
          if git diff --quiet; then echo "schema unchanged"; exit 0; fi
          branch="sync-schema/${REF//\//-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -am "chore: sync schema from erupts/erupt@$REF"
          git push -f origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --title "Sync schema from erupts/erupt@$REF" \
            --body "Regenerated by the sync-schema workflow from \`schema/\` of erupts/erupt@$REF."
