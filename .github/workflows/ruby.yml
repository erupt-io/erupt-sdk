name: ruby

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["ruby/**", "schema/**", "conformance/**", ".github/workflows/ruby.yml"]
  pull_request:
    paths: ["ruby/**", "schema/**", "conformance/**", ".github/workflows/ruby.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Generated files match schema/
        run: ruby tools/gen_types.rb ../schema --check
      # test only (the gem itself depends on nothing): runs the SQLite-backed cases too
      - name: Install sqlite3
        run: gem install --no-document sqlite3:2.8.1
      - name: Unit tests
        run: ruby -w -Ilib -e 'Dir["./test/test_*.rb"].sort.each { |f| require f }'
      - name: Conformance
        working-directory: .
        run: python3 conformance/run.py -- ruby ruby/examples/conformance.rb
