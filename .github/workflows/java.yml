name: java

on:
  push:
    paths: ["java/**", ".github/workflows/java.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java.yml"]

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java/examples/blog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build the example against the released erupt-cloud-node
        run: mvn -B -q package
