name: jvm

# The JVM nodes (erupt-cloud-node, erupt-cloud-node-lite) live in the erupt repository, which runs their conformance
# against this suite itself; here only the Spring example is built, against the released erupt.
on:
  # also run by release.yml before anything is published
  workflow_call:
  workflow_dispatch:
  push:
    paths: ["jvm/**", "schema/**", "conformance/**", ".github/workflows/jvm.yml"]
  pull_request:
    paths: ["jvm/**", "schema/**", "conformance/**", ".github/workflows/jvm.yml"]

permissions:
  contents: read

jobs:
  spring-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Spring blog against the released erupt-cloud-node-jpa
        run: mvn -B -q -f jvm/examples/spring-blog/pom.xml package
