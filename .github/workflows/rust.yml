name: rust

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["rust/**", "schema/**", "conformance/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "schema/**", "conformance/**", ".github/workflows/rust.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal -c clippy,rustfmt && rustup default stable
      - name: Generated files match schema/
        run: cargo run --bin gen-types -- ../schema --check
      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --all-features --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-features
      - name: Build the conformance fixture
        run: cargo build --release --example conformance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance
        working-directory: .
        run: python conformance/run.py -- rust/target/release/examples/conformance

  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain at the declared rust-version
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$MSRV" --profile minimal
          echo "MSRV=$MSRV" >> "$GITHUB_ENV"
      - name: Build the library with the default features
        run: cargo +"$MSRV" build --locked
