name: swift

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["swift/**", "schema/**", "conformance/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["swift/**", "schema/**", "conformance/**", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 5.9 is the oldest supported toolchain: it builds the package; swift-testing needs Swift 6
        swift: ["5.9", "6.2"]
    container: swift:${{ matrix.swift }}-jammy
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: Install libsqlite3-dev and python3
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev python3
      - name: Generated files match schema/
        run: swift run erupt-gen-types ../schema --check
      - name: Build
        run: swift build
      - name: Unit tests
        if: matrix.swift != '5.9'
        run: swift test
      - name: Build the conformance fixture
        run: swift build -c release --product Conformance
      - name: Conformance
        working-directory: .
        run: python3 conformance/run.py -- swift/.build/release/Conformance

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: swift
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: swift test
      - name: Conformance
        run: |
          swift build -c release --product Conformance
          python3 ../conformance/run.py -- .build/release/Conformance
