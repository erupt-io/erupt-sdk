name: jvm

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["jvm/**", "conformance/**", ".github/workflows/jvm.yml"]
  pull_request:
    paths: ["jvm/**", "conformance/**", ".github/workflows/jvm.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21", "25"]
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # the build JSON comes from erupt-annotation itself: no generated code to check against schema/
      - name: Unit tests
        run: mvn -B verify
      - name: Examples (Java conformance fixture, Kotlin blog)
        run: |
          mvn -B -q install -DskipTests
          mvn -B -f examples/pom.xml package
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance
        working-directory: .
        run: python conformance/run.py -- java -jar jvm/examples/conformance/target/erupt-conformance.jar
