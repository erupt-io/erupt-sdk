name: erupt_sdk
description: Serve models from Dart as erupt admin pages. The erupt server renders the admin UI, logs users in and checks menus; the node owns models and data.
version: 0.1.0
homepage: https://www.erupt.xyz
repository: https://github.com/erupt-io/erupt-sdk/tree/main/dart
issue_tracker: https://github.com/erupt-io/erupt-sdk/issues
topics: [admin, crud, low-code, erupt]

environment:
  sdk: ^3.3.0

# none at runtime: dart:io serves the node and talks to the erupt server
dev_dependencies:
  lints: ">=3.0.0 <7.0.0"
  sqlite3: ^2.4.0
  test: ^1.25.0
