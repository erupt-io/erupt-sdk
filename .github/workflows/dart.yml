name: dart

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["dart/**", "schema/**", "conformance/**", ".github/workflows/dart.yml"]
  pull_request:
    paths: ["dart/**", "schema/**", "conformance/**", ".github/workflows/dart.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ["3.3", "stable"]
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      # test only (the package itself depends on nothing): package:sqlite3 loads the system library
      - name: Install libsqlite3
        run: sudo apt-get install -y libsqlite3-dev
      - run: dart pub get
      - name: Generated files match schema/
        run: dart run tool/gen_types.dart ../schema --check
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Unit tests
        run: dart test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conformance
        run: |
          dart compile exe example/conformance.dart -o "$RUNNER_TEMP/erupt-dart-conformance"
          python ../conformance/run.py -- "$RUNNER_TEMP/erupt-dart-conformance"
      - name: Package is publishable
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
