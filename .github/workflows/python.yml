name: python

on:
  # also run by release.yml before anything is published
  workflow_call:
  push:
    paths: ["python/**", "schema/**", "conformance/**", ".github/workflows/python.yml"]
  pull_request:
    paths: ["python/**", "schema/**", "conformance/**", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generated files match schema/
        run: python tools/gen_types.py ../schema --check
      - name: Unit tests
        run: PYTHONPATH=src python -W error::DeprecationWarning -m unittest discover -s tests -v
      - name: Conformance
        working-directory: .
        env:
          PYTHONPATH: python/src
        run: python conformance/run.py -- python python/examples/conformance.py
